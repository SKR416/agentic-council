<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>決策智囊團儀表板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
<style>
/* 版面概念：暖象牙底 + 襯線標題的單欄長頁；區塊以細線分隔，只有雷達卡、立場條與原始報告使用卡片外框。
   主題切換：bare :root 為淺色；系統深色（除非 data-theme="light"）或 data-theme="dark" 切到深色。 */
:root {
  --bg: #FAF9F5;
  --surface: #FFFFFF;
  --surface-2: #F0EEE6;
  --fg: #141413;
  --fg-2: #5E5D59;
  --muted: #87867F;
  --border: #E8E6DC;
  --accent: #C96442;
  --accent-soft: #D97757;
  --good: #4F7F52;
  --warn: #A86F1F;
  --bad: #B5463A;
  --serif: "Noto Serif TC", "Songti TC", "PMingLiU", "PingFang TC", "Microsoft JhengHei", serif;
  --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #262624;
    --surface: #30302E;
    --surface-2: #3A3A37;
    --fg: #F5F4EE;
    --fg-2: #C2C0B6;
    --muted: #9C9A92;
    --border: #45443F;
    --accent: #D97757;
    --accent-soft: #E08A6D;
    --good: #7FB07F;
    --warn: #D9A350;
    --bad: #E07A6E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #262624;
  --surface: #30302E;
  --surface-2: #3A3A37;
  --fg: #F5F4EE;
  --fg-2: #C2C0B6;
  --muted: #9C9A92;
  --border: #45443F;
  --accent: #D97757;
  --accent-soft: #E08A6D;
  --good: #7FB07F;
  --warn: #D9A350;
  --bad: #E07A6E;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.7;
  overflow-wrap: anywhere;
}
[hidden] { display: none !important; }
.wrap {
  max-width: 1080px;
  margin-inline: auto;
  padding-inline: max(16px, 3vw);
  padding-block: 28px 64px;
}
h1, h2, h3 { font-family: var(--serif); font-weight: 600; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(26px, 5vw, 40px); line-height: 1.3; letter-spacing: 0.01em; }
h2 { font-size: 22px; line-height: 1.4; padding-block-end: 8px; margin-block-end: 18px; border-bottom: 1px solid var(--border); }
h3 { font-size: 16px; line-height: 1.5; }
h2 .note { font-family: var(--sans); font-size: 14px; font-weight: 400; color: var(--warn); margin-inline-start: 10px; }
p { margin: 0; }
ul, ol { margin: 0; padding-inline-start: 1.4em; }
li + li { margin-block-start: 6px; }
section { margin-block-start: 52px; min-width: 0; }
.muted { color: var(--muted); }
.sub { color: var(--fg-2); font-size: 14px; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* 提示條 */
.banners { display: grid; gap: 10px; margin-block-end: 24px; }
.banner {
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-inline-start: 4px solid var(--accent);
  background: var(--surface);
  font-size: 14px;
  min-width: 0;
}
.banner strong { font-weight: 500; }
.banner.warn { border-inline-start-color: var(--warn); background: color-mix(in oklab, var(--warn) 9%, var(--surface)); }
.banner.bad { border-inline-start-color: var(--bad); background: color-mix(in oklab, var(--bad) 10%, var(--surface)); }

/* 頁首 */
.head .meta { margin-block-start: 8px; color: var(--fg-2); font-size: 14px; display: flex; flex-wrap: wrap; gap: 4px 18px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-block-start: 16px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 1px 10px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--surface);
  color: var(--fg);
  font-size: 13px;
  line-height: 1.7;
  min-width: 0;
}
.chip .k { color: var(--muted); }
.chip.good { border-color: color-mix(in oklab, var(--good) 60%, var(--border)); background: color-mix(in oklab, var(--good) 11%, var(--surface)); }
.chip.warn { border-color: color-mix(in oklab, var(--warn) 60%, var(--border)); background: color-mix(in oklab, var(--warn) 11%, var(--surface)); }
.chip.bad  { border-color: color-mix(in oklab, var(--bad) 60%, var(--border)); background: color-mix(in oklab, var(--bad) 11%, var(--surface)); }
.chip.st   { border-color: color-mix(in oklab, var(--st) 60%, var(--border)); background: color-mix(in oklab, var(--st) 11%, var(--surface)); }
.chip.added { border-style: dashed; border-color: var(--accent); background: transparent; color: var(--accent); }
.chips-inline { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.chip.absent { border-style: dashed; color: var(--muted); background: transparent; }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--st); flex: none; }

/* 立場色階：綠 → 紅（有序尺度） */
.st-0 { --st: var(--good); }
.st-1 { --st: color-mix(in oklab, var(--good) 45%, var(--warn)); }
.st-2 { --st: color-mix(in oklab, var(--warn) 55%, var(--bad)); }
.st-3 { --st: var(--bad); }
.st-x { --st: var(--muted); }

/* 總覽 */
.stance-bar { display: flex; height: 22px; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; background: var(--surface-2); }
.stance-bar .seg { background: var(--st); min-width: 0; }
.stance-bar .seg + .seg { border-inline-start: 2px solid var(--bg); }
.legend { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px 14px; margin-block-start: 12px; }
.legend .it { display: flex; align-items: baseline; gap: 8px; min-width: 0; font-size: 14px; }
.legend .sw { width: 10px; height: 10px; border-radius: 2px; background: var(--st); flex: none; align-self: center; }
.legend .cnt { font-family: var(--serif); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; margin-inline-start: auto; }
.legend .it.zero { color: var(--muted); }
.subhead { margin-block: 28px 10px; }
.axis-note { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; color: var(--muted); margin-block-start: 6px; }

/* 表格 */
.tablewrap { overflow-x: auto; max-width: 100%; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 9px 12px; text-align: start; vertical-align: top; border-bottom: 1px solid var(--border); }
thead th { color: var(--fg-2); font-weight: 500; background: var(--surface-2); white-space: nowrap; }
tbody tr:last-child th, tbody tr:last-child td { border-bottom: 0; }
tbody th { font-weight: 500; white-space: nowrap; }
td.n, th.n { text-align: center; font-variant-numeric: tabular-nums; }
table.wide { min-width: 640px; }
table .chip, td.nw { white-space: nowrap; }
td.heat {
  background: var(--surface-2);
  background: color-mix(in oklab, var(--accent) var(--heat), var(--surface));
  font-weight: 500;
}
td.empty { color: var(--muted); }
.tear-mark { display: block; margin-block-start: 2px; font-size: 11px; font-weight: 500; color: var(--bad); }
.tear-mark::before { content: "\25B2\00a0"; font-size: 9px; }
.matrix-note { margin-block-start: 8px; font-size: 13px; color: var(--muted); }

/* 雷達 */
.radars { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 900px) { .radars { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 600px) { .radars { grid-template-columns: minmax(0, 1fr); } }
.card { border: 1px solid var(--border); border-radius: 10px; background: var(--surface); padding: 14px 14px 10px; min-width: 0; }
.card.absent { border-style: dashed; background: transparent; }
.card .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; min-width: 0; }
.card .top > div { min-width: 0; }
.card .role { font-family: var(--serif); font-weight: 600; font-size: 17px; line-height: 1.4; }
.card .seatno { font-size: 12px; color: var(--muted); }
.card .absent-body { padding-block: 40px; text-align: center; color: var(--fg-2); }
.card .absent-body .tag { display: block; font-family: var(--serif); font-size: 20px; font-weight: 600; color: var(--muted); margin-block-end: 6px; }
svg.radar { display: block; width: 100%; height: auto; margin-block-start: 4px; overflow: visible; }
svg.radar .ring { fill: none; stroke: var(--border); stroke-width: 1; }
svg.radar .axis { stroke: var(--border); stroke-width: 1; }
svg.radar .poly { fill: var(--accent); fill-opacity: 0.2; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }
svg.radar .vtx { fill: var(--accent); stroke: var(--surface); stroke-width: 1.5; }
svg.radar .hit { fill: transparent; cursor: default; }
svg.radar .lbl { fill: var(--fg-2); font-size: 12px; font-family: var(--sans); }
svg.radar .tick { fill: var(--muted); font-size: 9px; font-family: var(--sans); font-variant-numeric: tabular-nums; }
.radar-note { margin-block-start: 12px; font-size: 13px; color: var(--muted); }
#tip {
  position: fixed; z-index: 10; pointer-events: none;
  padding: 3px 9px; border-radius: 6px;
  background: var(--fg); color: var(--bg);
  font-size: 13px; line-height: 1.5; white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

/* 原始報告 */
.reports { display: grid; gap: 10px; }
details.rep { border: 1px solid var(--border); border-radius: 8px; background: var(--surface); min-width: 0; }
details.rep > summary { cursor: pointer; padding: 10px 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; list-style: none; }
details.rep > summary::-webkit-details-marker { display: none; }
details.rep > summary::before { content: "\25B8"; color: var(--muted); font-size: 12px; width: 1em; flex: none; }
details.rep[open] > summary::before { content: "\25BE"; }
details.rep > summary .role { font-family: var(--serif); font-weight: 600; }
details.rep > summary .no { color: var(--muted); font-size: 14px; }
details.rep > summary:focus-visible { outline-offset: -2px; }
.rep .body { padding: 4px 16px 16px; border-top: 1px solid var(--border); }
.report-text { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; line-height: 1.75; margin-block-start: 12px; }
.report-warn { margin-block-start: 10px; font-size: 13px; color: var(--warn); }
.absent-line { margin-block-start: 12px; color: var(--fg-2); }
.absent-line strong { font-family: var(--serif); color: var(--fg); margin-inline-end: 6px; }

/* 仲裁與方案 */
.block + .block { margin-block-start: 26px; }
.block > h3 { margin-block-end: 8px; }
.tendency { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.tendency p { flex: 1 1 280px; min-width: 0; }
.plan { padding-inline-start: 1.6em; }
.plan li { padding-inline-start: 4px; }
.plan .src { display: inline-flex; flex-wrap: wrap; gap: 4px; margin-inline-start: 8px; vertical-align: baseline; }
.plan .src .chip { font-size: 12px; padding-block: 0; }
.plan.timeline { list-style: none; padding: 0; }
.plan.timeline li { display: grid; grid-template-columns: 8.5em minmax(0, 1fr); gap: 14px; padding: 12px 4px; border-bottom: 1px solid var(--border); }
.plan.timeline li:last-child { border-bottom: 0; }
.plan.timeline .t { font-family: var(--serif); font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.plan.timeline .t.none { color: var(--muted); font-weight: 400; }
.conclusion { border: 1px solid var(--border); border-inline-start: 4px solid var(--accent); background: var(--surface); border-radius: 6px; padding: 18px 22px; }
.conclusion .row { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.conclusion .headline { flex: 1 1 320px; min-width: 0; font-family: var(--serif); font-size: 19px; line-height: 1.7; font-weight: 600; margin: 0; }
.conclusion h3 { margin-block: 16px 6px; font-size: 15px; }
.conclusion ul { margin: 0; padding-inline-start: 1.3em; }
.conclusion .jump { margin: 14px 0 0; font-size: 14px; }
.conclusion .jump a { color: var(--accent); }
.actions { list-style: none; padding: 0; counter-reset: act; display: grid; gap: 12px; }
.actions li { counter-increment: act; display: flex; gap: 14px; align-items: baseline; margin: 0; padding-block-end: 12px; border-bottom: 1px solid var(--border); min-width: 0; }
.actions li:last-child { border-bottom: 0; padding-block-end: 0; }
.actions li::before { content: counter(act); font-family: var(--serif); font-size: 26px; font-weight: 600; color: var(--accent); width: 1.2em; flex: none; font-variant-numeric: tabular-nums; }
.actions li span { min-width: 0; }
.empty-note { color: var(--muted); font-size: 14px; }
.error { border: 1px solid var(--bad); border-inline-start-width: 4px; background: color-mix(in oklab, var(--bad) 8%, var(--surface)); padding: 18px 20px; border-radius: 6px; }
.error h2 { border: 0; padding: 0; margin-block-end: 10px; }
.error pre { margin: 12px 0 0; padding: 10px 12px; background: var(--surface-2); font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; border-radius: 6px; }
footer { margin-block-start: 64px; padding-block-start: 16px; border-top: 1px solid var(--border); color: var(--muted); font-size: 13px; }

@media (max-width: 640px) {
  .legend { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .plan.timeline li { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  table.stack, table.stack tbody, table.stack tr, table.stack td { display: block; width: 100%; }
  table.stack thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  table.stack tr { padding: 10px 12px; border-bottom: 1px solid var(--border); }
  table.stack tbody tr:last-child { border-bottom: 0; }
  table.stack td { border: 0; padding: 2px 0; }
  table.stack td::before { content: attr(data-label); display: block; font-size: 12px; color: var(--muted); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
</style>
</head>

<div class="wrap">

  <div id="error-box" class="error" role="alert" hidden></div>

  <main id="app">
    <div id="banners" class="banners"></div>

    <header class="head" id="head"></header>

    <section id="sec-conclusion" aria-labelledby="h-conclusion">
      <h2 id="h-conclusion">結論摘要</h2>
      <div id="conclusion"></div>
    </section>

    <section aria-labelledby="h-overview">
      <h2 id="h-overview">總覽</h2>
      <div id="overview"></div>
    </section>

    <section aria-labelledby="h-scores">
      <h2 id="h-scores">六維評分<span id="absent-note" class="note" hidden></span></h2>
      <div id="radars" class="radars"></div>
      <p class="radar-note">刻度 0 至 10，同心圈每 2 分一格。滑過頂點可看該維度分數；完整數值見下方評分矩陣。</p>
      <h3 class="subhead">評分矩陣</h3>
      <div id="matrix"></div>
    </section>

    <section id="sec-excluded" aria-labelledby="h-excluded" hidden>
      <h2 id="h-excluded">未計入圖表的席位</h2>
      <div id="excluded"></div>
    </section>

    <section id="sec-audit-notes" aria-labelledby="h-audit-notes" hidden>
      <h2 id="h-audit-notes">稽核提示</h2>
      <div id="audit-notes"></div>
    </section>

    <section aria-labelledby="h-reports">
      <h2 id="h-reports">席位原始報告</h2>
      <div id="reports" class="reports"></div>
    </section>

    <section aria-labelledby="h-arb">
      <h2 id="h-arb">仲裁</h2>
      <div id="arbitration"></div>
    </section>

    <section aria-labelledby="h-disp">
      <h2 id="h-disp">防禦性底線處置表</h2>
      <div id="dispositions"></div>
    </section>

    <section aria-labelledby="h-plan">
      <h2 id="h-plan">硬化後的主方案</h2>
      <div id="plan"></div>
    </section>

    <section aria-labelledby="h-cb">
      <h2 id="h-cb">熔斷與止損條件</h2>
      <div id="breakers"></div>
    </section>

    <section aria-labelledby="h-next">
      <h2 id="h-next">即刻行動清單</h2>
      <div id="actions"></div>
    </section>

    <footer>本頁為決策建議，不含任何執行授權</footer>
  </main>
</div>
<div id="tip" role="tooltip" hidden></div>

    var ok = list.filter(function (s) { return s.verdict === '通過' || s.verdict === '未稽核'; });
    var pool = ok.length ? ok : list;
    return { entry: pool[pool.length - 1], count: list.length };
  }

  function firstReason(e) {
    var list = arr(e && e.isolation).concat(arr(e && e.dispatch));
    for (var i = 0; i < list.length; i++) {
      var x = list[i];
      if (typeof x === 'string' && x.length) return x;
      if (x && typeof x === 'object') return JSON.stringify(x);
    }
    return '（稽核未提供判定理由）';
  }

  function buildModel(data) {
    var audit = data && data.audit;
    if (!audit || !Array.isArray(audit.seats) || !audit.aggregate || typeof audit.aggregate !== 'object') {
      throw new Error('缺少 audit.seats 或 audit.aggregate。');
    }
    var syn = (data.synthesis && typeof data.synthesis === 'object') ? data.synthesis : {};
    var reasons = (syn.absent_reasons && typeof syn.absent_reasons === 'object') ? syn.absent_reasons : {};
    var agg = audit.aggregate;
    var validList = arr(agg.valid_seats).map(Number);
    var seats = ROLES.map(function (r) {
      var p = pickEntry(audit.seats, r.n);
      // 圖表席位 = aggregate.valid_seats 與「verdict 通過且未被離題排除」的交集（舊 audit.json 可能把未稽核放進 valid_seats）。
      var passed = !!(p.entry && p.entry.verdict === '通過' && p.entry.excluded_by_role_check !== true);
      var inValid = validList.indexOf(r.n) >= 0 && passed;
      var unaudited = !!(p.entry && p.entry.verdict === '未稽核' && p.entry.excluded_by_role_check !== true);
      var reason = '';
      if (!inValid) {
        reason = str(reasons[String(r.n)]) || (p.entry ? str(p.entry.verdict, '無稽核判定') : '無執行紀錄');
      }
      return {
        n: r.n, zh: r.zh, en: r.en, entry: p.entry, count: p.count, valid: inValid, reason: reason,
        unaudited: unaudited, label: unaudited ? '未稽核' : '缺席',
        auditReason: unaudited ? firstReason(p.entry) : '',
        retried: !!(p.entry && p.entry.retried === true),
        excluded: !!(p.entry && p.entry.excluded_by_role_check === true),
        scores: (p.entry && p.entry.scores && typeof p.entry.scores === 'object') ? p.entry.scores : {},
        stance: p.entry ? p.entry.stance : null
      };
    });
    var attended = seats.filter(function (s) { return s.valid; }).length;
    // 立場分布只由圖表席位重新統計，不信任 aggregate.stance_distribution。
    var dist = {};
    seats.forEach(function (s) { if (s.valid && stanceIdx(s.stance) >= 0) dist[s.stance] = (dist[s.stance] || 0) + 1; });
    agg = Object.assign({}, agg, { stance_distribution: dist });
    return {
      anchoring: arr(audit.anchoring_terms), unsourced: arr(audit.unsourced_numbers), meta: (data.meta && typeof data.meta === 'object') ? data.meta : {}, agg: agg, syn: syn, seats: seats, attended: attended };
  }

  // ---------- 區塊渲染 ----------

    }

    mount('head', [

        el('span', null, '執行編號 ', el('span', { 'class': 'num' }, str(meta.run_id, DASH))),
        el('span', null, '產生時間 ', el('span', { 'class': 'num' }, str(meta.generated_at, DASH)))),
      el('div', { 'class': 'chips' },
        chip(str(meta.dispatch_mode, DASH), meta.dispatch_mode === '降級' ? 'bad' : '', '派發模式'),
        chip(str(meta.audit_method, DASH), meta.audit_method === '人工' ? 'warn' : '', '稽核方式'),
        chip(m.attended + '/6', m.attended < 6 ? 'warn' : '', '到席'),
        chip(retry, '', '重派次數'))
    ]);
  }

  // ----- 結論摘要（置頂）：一句話結論、傾向、最優先的熔斷條件 -----
  function renderConclusion(m) {
    var syn = m.syn;

    var head = str(syn.conclusion) || str(tend.text);

    mount('conclusion', el('div', { 'class': 'conclusion' },
      el('div', { 'class': 'row' },
        tend.result ? chip(str(tend.result), rcls, '與原傾向') : null,
        head ? el('p', { 'class': 'headline' }, head) : null),
      cb.length ? el('h3', null, '最優先的熔斷條件') : null,
      cb.length ? el('ul', null, cb.map(function (t) { return el('li', null, t); })) : null,
      el('p', { 'class': 'jump' }, el('a', { href: '#h-plan' }, '完整硬化方案、熔斷條件與行動清單 ↓'))));
  }

  function renderOverview(m) {

      STANCES.forEach(function (s, i) {

    var tears = arr(m.agg.tears).filter(function (t) {

          el('td', { 'data-label': '最低分', 'class': 'num' }, '席位 ' + (lo[1] === undefined ? DASH : lo[1]) + '：' + (lo[0] === undefined ? DASH : lo[0]) + ' 分'),
          el('td', { 'data-label': '差距', 'class': 'num' }, isNum(t.gap) ? String(t.gap) : DASH)));
      });
      tearBody = el('div', { 'class': 'tablewrap' }, el('table', { 'class': 'stack' },
        el('thead', null, el('tr', null, el('th', null, '維度'), el('th', null, '最高分席位'), el('th', null, '最低分席位'), el('th', null, '差距'))),
        tbody));

    ]);

  // ----- 雷達圖（內嵌 SVG，由 JS 繪製） -----
  var tipEl = document.getElementById('tip');
  function showTip(e, text) {
    tipEl.textContent = text;
    tipEl.hidden = false;
    var w = tipEl.offsetWidth, h = tipEl.offsetHeight;
    var x = Math.min(Math.max(8, e.clientX - w / 2), window.innerWidth - w - 8);
    var y = e.clientY - h - 14;
    if (y < 8) y = e.clientY + 18;
    tipEl.style.left = x + 'px';
    tipEl.style.top = y + 'px';
  }
  function hideTip() { tipEl.hidden = true; }

  function radar(seat) {
    var W = 320, H = 250, cx = 160, cy = 125, R = 84;
    function ang(i) { return -Math.PI / 2 + i * Math.PI / 3; }
    function pt(i, v, scale) {
      var r = R * (v / 10) * (scale || 1);
      return [cx + r * Math.cos(ang(i)), cy + r * Math.sin(ang(i))];
    }
    function f(n) { return n.toFixed(1); }
    function poly(vals, scale) {
      return vals.map(function (v, i) { var p = pt(i, v, scale); return f(p[0]) + ',' + f(p[1]); }).join(' ');
    }
    var label = '席位 ' + seat.n + ' ' + seat.zh + ' 六維評分：' + DIMS.map(function (d) { return d + ' ' + seat.scores[d]; }).join('、');
    var svg = sv('svg', { 'class': 'radar', viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': label });
    [2, 4, 6, 8, 10].forEach(function (g) {
      svg.appendChild(sv('polygon', { 'class': 'ring', points: poly(DIMS.map(function () { return g; })) }));
    });
    DIMS.forEach(function (d, i) {
      var p = pt(i, 10);
      svg.appendChild(sv('line', { 'class': 'axis', x1: cx, y1: cy, x2: f(p[0]), y2: f(p[1]) }));
    });
    [2, 4, 6, 8, 10].forEach(function (g) {
      svg.appendChild(sv('text', { 'class': 'tick', x: cx + 4, y: f(cy - R * g / 10 - 2) }, String(g)));
    });
    DIMS.forEach(function (d, i) {
      var p = pt(i, 10, 1.13), c = Math.cos(ang(i));
      var anchor = c > 0.3 ? 'start' : (c < -0.3 ? 'end' : 'middle');
      var dy = i === 0 ? -2 : (i === 3 ? 12 : 4);
      svg.appendChild(sv('text', { 'class': 'lbl', x: f(p[0]), y: f(p[1] + dy), 'text-anchor': anchor }, d));
    });
    var vals = DIMS.map(function (d) { return seat.scores[d]; });
    svg.appendChild(sv('polygon', { 'class': 'poly', points: poly(vals) }));
    DIMS.forEach(function (d, i) {
      var p = pt(i, vals[i]);
      svg.appendChild(sv('circle', { 'class': 'vtx', cx: f(p[0]), cy: f(p[1]), r: 3.5 }));
      var hit = sv('circle', { 'class': 'hit', cx: f(p[0]), cy: f(p[1]), r: 11 });
      var text = d + '：' + vals[i];
      hit.addEventListener('pointerenter', function (e) { showTip(e, text); });
      hit.addEventListener('pointermove', function (e) { showTip(e, text); });
      hit.addEventListener('pointerleave', hideTip);
      hit.addEventListener('pointercancel', hideTip);
      svg.appendChild(hit);
    });
    return svg;
  }

  function renderRadars(m) {
    var absentCount = m.seats.filter(function (s) { return !s.valid; }).length;
    var note = document.getElementById('absent-note');
    note.hidden = absentCount === 0;

      } else if (!DIMS.every(function (d) { return isNum(s.scores[d]); })) {
        body = el('div', { 'class': 'absent-body' }, '評分資料不完整，無法繪製雷達圖。');

  // ----- 評分矩陣 -----
  function renderMatrix(m) {
    var tearDims = {};

    arr(m.agg.tears).forEach(function (t) {

    mount('matrix', [
      el('div', { 'class': 'tablewrap', tabindex: '0', role: 'region', 'aria-label': '評分矩陣（可橫向捲動）' },
        el('table', { 'class': 'wide' },

    ]);

  // ----- 處置表 -----
  function renderDispositions(m) {
    var rows = arr(m.syn.baseline_dispositions);
    if (!rows.length) { mount('dispositions', emptyNote()); return; }
    var tbody = el('tbody');
    rows.forEach(function (r) {
      var d = str(r.decision, DASH);
      var cls = d === '採納' ? 'good' : (d === '部分採納' ? 'warn' : (d === '駁回' ? 'bad' : ''));
      tbody.appendChild(el('tr', null,
        el('td', { 'data-label': '席位', 'class': 'num nw' }, '席位 ' + (r.seat === undefined ? DASH : r.seat)),
        el('td', { 'data-label': '底線內容' }, str(r.text)),
        el('td', { 'data-label': '處置' }, chip(d, cls)),
        el('td', { 'data-label': '理由' }, str(r.reason))));
    });
    mount('dispositions', el('div', { 'class': 'tablewrap' }, el('table', { 'class': 'stack' },
      el('thead', null, el('tr', null, el('th', null, '席位'), el('th', null, '底線內容'), el('th', null, '處置'), el('th', null, '理由'))),
      tbody)));
  }

  // ----- 主方案 -----
  function renderPlan(m) {
    var items = arr(m.syn.plan);
    if (!items.length) { mount('plan', emptyNote()); return; }
    var timed = items.some(function (it) { return it && typeof it.time === 'string' && it.time.length; });
    var ol = el('ol', { 'class': timed ? 'plan timeline' : 'plan' });
    items.forEach(function (it) {
      var srcs = arr(it && it.sources);
      var src = el('span', { 'class': 'src' });
      if (srcs.length) srcs.forEach(function (n) { src.appendChild(chip('席位 ' + n)); });
      else src.appendChild(chip('主代理新增', 'added'));
      if (timed) {
        var tm = str(it && it.time);
        ol.appendChild(el('li', null, el('span', { 'class': tm ? 't' : 't none' }, tm || DASH),
          el('span', null, str(it && it.text), src)));
      } else {
        ol.appendChild(el('li', null, str(it && it.text), src));
      }
    });
    mount('plan', ol);
  }

  function renderTail(m) {
    mount('breakers', bulletList(m.syn.circuit_breakers));
    var acts = arr(m.syn.next_actions).filter(function (x) { return typeof x === 'string' && x.length; });
    mount('actions', acts.length
      ? el('ol', { 'class': 'actions' }, acts.map(function (t) { return el('li', null, el('span', null, t)); }))
      : emptyNote());
  }

  // ---------- 啟動 ----------
  function showError(message, detail) {
    var box = document.getElementById('error-box');
    box.replaceChildren();
    add(box, [
      el('h2', null, '無法顯示儀表板資料'),
      el('p', null, message),
      detail ? el('pre', null, detail) : null,
      el('p', { 'class': 'sub', style: 'margin-block-start:12px' },
        '請檢查 COUNCIL-DATA:BEGIN 與 COUNCIL-DATA:END 之間的 JSON 是否完整：字串內的雙引號需跳脫，"</" 需寫成 "<\\/"，不得有結尾多餘的逗號。')
    ]);
    box.hidden = false;
    document.getElementById('app').hidden = true;
  }

  var data;
  try {
    data = JSON.parse(document.getElementById('council-data').textContent);
  } catch (err) {
    showError('council-data 區塊的 JSON 格式有誤，無法解析。', String(err && err.message));
    return;
  }
  try {
    var model = buildModel(data);
    renderTop(model);
    renderConclusion(model);
    renderOverview(model);
    renderRadars(model);
    renderMatrix(model);
    renderExcluded(model);
    renderAuditNotes(model);
    renderReports(model);
    renderArbitration(model);
    renderDispositions(model);
    renderPlan(model);
    renderTail(model);
  } catch (err) {
    showError('council-data 的資料結構不符合預期，部分內容無法顯示。', String(err && err.message));
  }
})();
</script>
</body>
</html>
